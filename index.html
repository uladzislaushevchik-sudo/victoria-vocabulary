<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Victoria · Vocabulary + Speaking</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Loading…</p>
<script>
async function go() {
  const names = ['h0.txt', 'h1.txt', 'h2.txt', 'h3.txt', 'h4.txt', 'h5.txt', 'h6.txt', 'h7.txt', 'h8.txt'];
  const v = "20261009x";
  const parts = await Promise.all(
    names.map(n => fetch(n + "?v=" + v).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + n);
      return r.text();
    }))
  );
  const hex = parts.map(p => p.replace(/\s+/g, "")).join("");
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:red;margin:40px 16px">Error: '+String(e)+'</p>';
});
</script>
</body>
</html>
