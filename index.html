<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Victoria · Vocabulary + Speaking</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Loading…</p>
<script>
async function go() {
  const names = ['r0.txt', 'r1.txt', 'r2.txt', 'r3.txt', 'r4.txt', 'r5.txt', 'r6.txt'];
  const v = "20261009r";
  const parts = await Promise.all(
    names.map(n => fetch(n + "?v=" + v).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + n);
      return r.text();
    }))
  );
  const b64 = parts.map(p => p.replace(/\s+/g, "")).join("");
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:red;margin:40px 16px">Error: '+String(e)+'</p>';
});
</script>
</body>
</html>
