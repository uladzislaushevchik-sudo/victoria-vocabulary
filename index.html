<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Victoria · Vocabulary + Speaking</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Loading…</p>
<script>
async function go() {
  const names = ["p0.txt","p1.txt","p2.txt"];
  const v = "20261009j";
  const parts = await Promise.all(names.map(n => fetch(n+"?v="+v).then(r => { if(!r.ok) throw new Error(n); return r.text(); })));
  document.open(); document.write(parts.join("")); document.close();
}
go().catch(e => { document.body.innerHTML = "<p style=\"color:red;text-align:center;margin:40px\">Error: "+e+"</p>"; });
</script>
</body>
</html>
