<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Виктория · Vocabulary + Speaking</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Загрузка…</p>
<script>
async function go() {
  const names = ["c0.txt", "c1.txt", "c2.txt", "c3.txt", "c4.txt", "c5.txt"];
  const v = "20261009c";
  const parts = await Promise.all(
    names.map(n => fetch(n + "?v=" + v).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + n);
      return r.text();
    }))
  );
  const b64 = parts.map(p => p.replace(/\s+/g, "")).join("");
  let bin;
  try {
    bin = atob(b64);
  } catch (e) {
    throw new Error("atob failed (len=" + b64.length + "): " + e.message);
  }
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let html;
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    html = await new Response(stream).text();
  } catch (e) {
    throw new Error("gzip failed (bytes=" + bytes.length + "): " + e.message);
  }
  document.open();
  document.write(html);
  document.close();
}
go().catch(e => {
  document.body.innerHTML =
    '<p style="font-family:system-ui;text-align:center;color:red;margin:40px 16px">Ошибка: ' +
    String(e) +
    '</p><p style="font-family:system-ui;text-align:center"><a href="?reload=' +
    Date.now() +
    '">Обновить</a></p>';
});
</script>
</body>
</html>
