<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Victoria · Vocabulary + Speaking</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px">Loading…</p>
<script>
async function go() {
  const names = ['u0.txt', 'u1.txt', 'u2.txt', 'u3.txt', 'u4.txt', 'u5.txt'];
  const v = "20261009u";
  const parts = await Promise.all(
    names.map(n => fetch(n + "?v=" + v).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + n);
      return r.text();
    }))
  );
  document.open(); document.write(parts.join("")); document.close();
}
go().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;text-align:center;color:red;margin:40px 16px">Error: '+String(e)+'</p>';
});
</script>
</body>
</html>
